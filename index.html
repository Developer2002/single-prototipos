<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Protótipo app Single</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* VOICE everyday product mock-up, reviewed by the team that approved the Single flows
   IDEA the Single time-clock app as it would ship, dressed in Bizneo's workspace language
   PICTURE the phone itself, live and clickable, with a screen index beside it
   COLOUR warm paper #F7F6F3 ground, navy ink #1E2941, pastel status fields (lime, butter, blush, lavender)
   TYPE Nunito Sans 800 for titles and figures, Nunito Sans 400-700 for text
   LAYOUT laptop: index column left, phone right; 720px: index above phone; phone: the app fills the screen */
      :root {
        color-scheme: light dark;
        --pg: light-dark(#eceae4, #12172a);
        --pg-ink: light-dark(#1e2941, #e9eaf0);
        --pg-mut: light-dark(#5b6478, #a6acbf);
        --pg-line: light-dark(#d9d5cc, #2b3253);
        --pg-btn: light-dark(#ffffff, #1b2140);
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        min-width: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--pg);
        color: var(--pg-ink);
        font: 16px/1.55 "Nunito Sans", system-ui, sans-serif;
        overflow-x: clip;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      :focus-visible {
        outline: 2px solid #3b4898;
        outline-offset: 2px;
      }
      .wrap {
        display: grid;
        grid-template-columns: minmax(0, 330px) minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        grid-template-areas: "intro stage" "nav stage";
        column-gap: 48px;
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px max(4vw, 16px);
        min-height: 100%;
        align-items: start;
      }
      .intro {
        grid-area: intro;
      }
      .navc {
        grid-area: nav;
        padding-bottom: 24px;
      }
      .side {
        padding: 4px 2px;
      }
      .wm-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 800 20px/1 "Nunito Sans", sans-serif;
      }
      .side h1 {
        font: 800 34px/1.05 "Nunito Sans", sans-serif;
        letter-spacing: -0.02em;
        margin: 22px 0 12px;
        text-wrap: balance;
      }
      .side p {
        margin: 0 0 10px;
        color: var(--pg-mut);
      }
      .side .note {
        font-size: 14px;
      }
      .navc .grp:first-child {
        margin-top: 6px;
      }
      .grp {
        margin-top: 18px;
      }
      .grp h2 {
        font: 800 14px/1.2 "Nunito Sans", sans-serif;
        margin: 0 0 8px;
        color: var(--pg-ink);
      }
      .grp div {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .jb {
        height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--pg-line);
        background: var(--pg-btn);
        color: var(--pg-ink);
        font: 600 13px "Nunito Sans", sans-serif;
      }
      .jb.on {
        background: var(--pg-ink);
        border-color: var(--pg-ink);
        color: var(--pg);
      }
      .reset {
        margin-top: 20px;
        height: 40px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--pg-ink);
        background: transparent;
        color: var(--pg-ink);
        font: 700 14px "Nunito Sans", sans-serif;
      }
      .tok {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-top: 22px;
      }
      .tok span {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font: 600 12px/1.3 "Nunito Sans", sans-serif;
        color: var(--pg-mut);
      }
      .tok i {
        display: block;
        height: 28px;
        border-radius: 8px;
        border: 1px solid var(--pg-line);
      }
      .stage {
        grid-area: stage;
        display: flex;
        justify-content: center;
        position: sticky;
        top: 24px;
      }
      .phone {
        width: 390px;
        height: min(844px, calc(100svh - 48px));
        min-height: 620px;
        border-radius: 52px;
        background: #0c101d;
        padding: 11px;
        box-shadow: 0 30px 70px -34px rgba(12, 16, 29, 0.55),
          0 0 0 1px light-dark(transparent, #2b3253);
      }
      .app {
        --bg: #f7f6f3;
        --sf: #ffffff;
        --ink: #1e2941;
        --mut: #5b6478;
        --mut2: #8a90a0;
        --line: #e7e3dc;
        --line2: #e2e4e9;
        --nv: #1e2941;
        --ind: #3b4898;
        --warm: #f1efea;
        --lav: #edefff;
        --lav2: #c4caff;
        --g: #eff5d2;
        --g2: #deecaa;
        --gi: #4a6111;
        --y: #fdf3c8;
        --y2: #fbe68c;
        --yi: #7a5b00;
        --r: #fdecec;
        --r2: #f6c9c9;
        --ri: #a3262a;
        --b: #e3eefc;
        --b2: #ccdef9;
        --bi: #2d5aa0;
        --pe: #fdebd7;
        --pe2: #fbd6ad;
        --pei: #9a5212;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        height: 100%;
        border-radius: 41px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 "Nunito Sans", system-ui, sans-serif;
        color-scheme: light;
      }
      .sbar {
        height: 46px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 28px 0 34px;
        font: 800 15px "Nunito Sans", sans-serif;
      }
      .sbar span {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
        overscroll-behavior: contain;
      }
      .pad {
        padding: 4px 16px 28px;
      }
      .pt0 {
        padding-top: 0;
      }
      .sp {
        flex: 1;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 16px 8px;
        min-height: 58px;
      }
      .top h1 {
        flex: 1;
        margin: 0;
        font: 800 20px/1.2 "Nunito Sans", sans-serif;
      }
      .top.main h1 {
        font-size: 26px;
        letter-spacing: -0.01em;
      }
      .ib {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--line2);
        background: var(--sf);
        color: var(--ink);
        display: grid;
        place-items: center;
        flex: none;
        padding: 0;
        position: relative;
      }
      .ib.gh {
        border-color: transparent;
        background: transparent;
      }
      .ib.sm {
        width: 34px;
        height: 34px;
      }
      .ib.sq {
        border-radius: 10px;
      }
      .ib.sq.on {
        background: var(--nv);
        border-color: var(--nv);
        color: #fff;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 0 -6px;
      }
      .badge {
        position: absolute;
        top: 3px;
        right: 2px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: #d1343a;
        color: #fff;
        font: 800 11px/18px "Nunito Sans", sans-serif;
        text-align: center;
      }
      .badge.s {
        position: static;
        margin-left: auto;
      }
      .av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--pe2);
        background: var(--pe);
        color: var(--ink);
        font: 800 14px "Nunito Sans", sans-serif;
        display: grid;
        place-items: center;
        flex: none;
        padding: 0;
      }
      .av.lg {
        width: 60px;
        height: 60px;
        font-size: 20px;
      }
      .date {
        margin: 10px 0 0;
        color: var(--mut);
        font: 600 14px "Nunito Sans", sans-serif;
      }
      .hi {
        margin: 0;
        font: 800 28px/1.15 "Nunito Sans", sans-serif;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 0 0 10px;
        color: var(--mut);
        font: 600 14px/1.4 "Nunito Sans", sans-serif;
      }
      .sec-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 24px 0 10px;
        min-height: 28px;
      }
      .sec-h h2 {
        margin: 0;
        font: 800 17px/1.2 "Nunito Sans", sans-serif;
      }
      .lnk {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 0;
        background: none;
        padding: 6px 0;
        color: var(--ink);
        font: 700 14px "Nunito Sans", sans-serif;
        white-space: nowrap;
      }
      .lnk.sm {
        font-size: 13px;
        color: var(--ind);
        padding: 0 0 0 8px;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .btn {
        height: 48px;
        border-radius: 10px;
        border: 1px solid var(--nv);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 18px;
        font: 700 15px "Nunito Sans", sans-serif;
        white-space: nowrap;
      }
      .btn.pri {
        background: var(--nv);
        color: #fff;
      }
      .btn.out {
        background: var(--sf);
        color: var(--nv);
      }
      .btn.gh {
        background: transparent;
        border-color: transparent;
        color: var(--nv);
      }
      .btn.lt {
        height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border-color: var(--line2);
        background: var(--sf);
        color: var(--nv);
        font-size: 13px;
      }
      .btn.blk {
        width: 100%;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .mt {
        margin-top: 12px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--line2);
        border-radius: 999px;
        background: var(--sf);
        color: var(--mut);
        font: 700 12px "Nunito Sans", sans-serif;
        white-space: nowrap;
      }
      .chip.lk {
        background: var(--warm);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        border-width: 1px;
        border-style: solid;
        font: 700 12px "Nunito Sans", sans-serif;
        white-space: nowrap;
        flex: none;
      }
      .pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .g {
        --tb: var(--g);
        --tl: var(--g2);
        --ti: var(--gi);
      }
      .y {
        --tb: var(--y);
        --tl: var(--y2);
        --ti: var(--yi);
      }
      .r {
        --tb: var(--r);
        --tl: var(--r2);
        --ti: var(--ri);
      }
      .l {
        --tb: var(--lav);
        --tl: var(--lav2);
        --ti: var(--ind);
      }
      .b {
        --tb: var(--b);
        --tl: var(--b2);
        --ti: var(--bi);
      }
      .pe {
        --tb: var(--pe);
        --tl: var(--pe2);
        --ti: var(--pei);
      }
      .n {
        --tb: var(--warm);
        --tl: #e2ded6;
        --ti: var(--mut);
      }
      .pill,
      .ico,
      .banner,
      .shift,
      .wk-b {
        background: var(--tb);
        border-color: var(--tl);
        color: var(--ti);
      }
      .ico {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border-width: 1px;
        border-style: solid;
        display: grid;
        place-items: center;
        flex: none;
      }
      .db {
        display: inline-flex;
        flex-direction: column;
        width: 44px;
        flex: none;
        border: 1px solid var(--line2);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
        text-align: center;
      }
      .db b {
        background: var(--nv);
        color: #fff;
        font: 700 12px/18px "Nunito Sans", sans-serif;
      }
      .db span {
        font: 800 18px/26px "Nunito Sans", sans-serif;
        color: var(--ink);
      }
      .li {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 14px;
        border: 0;
        background: none;
        color: inherit;
        text-align: left;
        min-height: 60px;
      }
      .li + .li,
      .li + .arow,
      .arow + .arow,
      .arow + .li {
        border-top: 1px solid #f0ede8;
      }
      button.li:hover,
      .pr-main:hover,
      .ar-main:hover {
        background: #fbfaf8;
      }
      .li > svg {
        color: var(--mut2);
        flex: none;
      }
      .li-t {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .li-t b {
        font: 700 15px/1.3 "Nunito Sans", sans-serif;
      }
      .li-t b.rd {
        font-weight: 600;
        color: #3a445c;
      }
      .li-t small {
        color: var(--mut);
        font: 600 13px/1.35 "Nunito Sans", sans-serif;
      }
      .li-r {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        flex: none;
      }
      .li-r small {
        color: var(--mut2);
        font: 600 12px "Nunito Sans", sans-serif;
        white-space: nowrap;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ind);
      }
      .neg {
        color: var(--ri) !important;
      }
      .pos {
        color: var(--gi) !important;
      }
      .li.dis {
        opacity: 0.7;
      }
      .li.danger b {
        color: var(--ri);
      }
      .tcard {
        padding: 16px 16px 14px;
      }
      .tm {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 6px;
      }
      .tm svg {
        align-self: center;
        color: var(--mut);
      }
      .tm b {
        font: 800 42px/1 "Nunito Sans", sans-serif;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .tm small {
        width: 22px;
        font: 800 17px "Nunito Sans", sans-serif;
        color: var(--mut);
        font-variant-numeric: tabular-nums;
      }
      .tm-l {
        text-align: center;
        color: var(--mut);
        font: 600 13px "Nunito Sans", sans-serif;
        margin: 2px 0 10px;
      }
      .ctr {
        text-align: center;
      }
      .shift {
        display: block;
        margin: 14px 0;
        padding: 10px 12px;
        border-width: 1px;
        border-style: solid;
        border-radius: 10px;
        text-align: center;
      }
      .shift b {
        display: block;
        color: var(--ink);
        font: 800 16px/1.3 "Nunito Sans", sans-serif;
      }
      .shift span {
        color: var(--mut);
        font: 600 13px "Nunito Sans", sans-serif;
      }
      .cap {
        margin: 10px 0 0;
        text-align: center;
        color: var(--mut);
        font: 600 13px "Nunito Sans", sans-serif;
      }
      .week {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        margin: 0 -16px;
        padding: 0 16px 6px;
        scroll-padding: 0 16px;
        scrollbar-width: none;
      }
      .wk {
        flex: 0 0 138px;
        scroll-snap-align: start;
        padding: 10px;
      }
      .wk-h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .wk-h b {
        font: 800 13px "Nunito Sans", sans-serif;
      }
      .wk-h small {
        color: var(--mut2);
        font: 700 12px "Nunito Sans", sans-serif;
      }
      .wk-b {
        display: block;
        border-width: 1px;
        border-style: solid;
        border-radius: 8px;
        padding: 8px;
        text-align: center;
      }
      .wk-b b {
        display: block;
        color: var(--ink);
        font: 800 16px "Nunito Sans", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .wk-b span {
        color: var(--mut);
        font: 600 12px "Nunito Sans", sans-serif;
        white-space: nowrap;
      }
      .wk-s {
        margin: 8px 0;
        color: var(--mut);
        font: 600 12px "Nunito Sans", sans-serif;
        text-align: center;
      }
      .wk.today {
        border-color: var(--nv);
      }
      .fbar {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 0 -16px;
        padding: 2px 16px 4px;
        scrollbar-width: none;
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line2);
        border-radius: 999px;
        background: var(--sf);
        color: var(--ink);
        font: 700 13px "Nunito Sans", sans-serif;
        white-space: nowrap;
        flex: none;
      }
      .banner {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin: 12px 0 0;
        padding: 12px 14px;
        border-width: 1px;
        border-style: solid;
        border-radius: 12px;
        text-align: left;
        font: 700 14px/1.35 "Nunito Sans", sans-serif;
      }
      .banner span {
        flex: 1;
        color: var(--ink);
      }
      .banner > b {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .banner.col {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .banner.col span {
        font-weight: 600;
      }
      .day {
        margin-top: 12px;
        overflow: visible;
      }
      .day-h {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 6px 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .day-t {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .day-t b {
        font: 800 16px "Nunito Sans", sans-serif;
      }
      .day-t small {
        color: var(--mut);
        font: 600 13px "Nunito Sans", sans-serif;
      }
      .prow,
      .arow {
        position: relative;
        display: flex;
        align-items: center;
        padding-right: 6px;
      }
      .prow + .prow {
        border-top: 1px solid #f0ede8;
      }
      .pr-main,
      .ar-main {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 10px 4px 10px 12px;
        border: 0;
        background: none;
        color: inherit;
        text-align: left;
      }
      .t {
        width: 50px;
        flex: none;
        font: 800 17px "Nunito Sans", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .pr-t {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .pr-t span {
        font: 700 14px "Nunito Sans", sans-serif;
      }
      .pr-t small {
        color: var(--mut);
        font: 600 12px "Nunito Sans", sans-serif;
      }
      .rec .t,
      .rec .pr-t span {
        color: var(--mut2);
        text-decoration: line-through;
      }
      .pop {
        position: absolute;
        right: 8px;
        top: 48px;
        z-index: 30;
        min-width: 214px;
        padding: 6px;
        background: #fff;
        border: 1px solid var(--line2);
        border-radius: 12px;
        box-shadow: 0 14px 30px -10px rgba(30, 41, 65, 0.3);
      }
      .pop button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 44px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink);
        font: 700 14px "Nunito Sans", sans-serif;
        text-align: left;
      }
      .pop button:hover {
        background: var(--bg);
      }
      .pop p {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 8px 10px;
        color: var(--mut);
        font: 600 13px "Nunito Sans", sans-serif;
      }
      .scrim0 {
        position: absolute;
        inset: 0;
        z-index: 20;
      }
      .empty {
        margin-top: 14px;
        padding: 22px;
        text-align: center;
      }
      .empty p {
        color: var(--mut);
        margin: 4px 0 14px;
      }
      .stats {
        display: grid;

              adiant: f.adiant,
            };
            S.fers.unshift(it);
            S.ferSel = it.id;
            S.ferLast = it;
            pushReq("Férias", f.ini.slice(0, 5) + " a " + fim.slice(0, 5));
            S.hist = ["inicio", "ferias"];
            S.scr = "ferias-enviada";
            clean();
            setHash();
            render();
          },
          openFer(id) {
            A.go("ferias-detalhe", { ferSel: id });
          },
          ferDoc(k) {
            const f = curFer();
            dlFile({
              n:
                k + "_ferias_" + f.ini.slice(0, 2) + f.ini.slice(3, 5) + ".pdf",
              x: "pdf",
            });
          },
          pref(k, v) {
            S.prefs[k] = v;
          },
          jump(k) {
            S.comp = null;
            S.pLoading = false;
            S.toast = null;
            clean();
            (J[k] || J.inicio)();
          },
        });

        /* ---------- índice de telas ---------- */
        const J = {
          entrar: () => A.logout(),
          inicio: () => A.tab("inicio"),
          notificacoes: () => {
            A.tab("inicio");
            A.go("notificacoes");
          },
          menu: () => {
            A.tab("inicio");
            A.openDrawer();
          },
          registrar: () => {
            A.tab("inicio");
            A.openPonto();
          },
          comprovante: () => {
            A.tab("inicio");
            S.comp = { tipo: "Saída", t: "17:03", nsr: "000185" };
            render();
          },
          ponto: () => A.tab("ponto"),
          filtros: () => {
            A.tab("ponto");
            A.openFilter();
          },
          "menu-batida": () => {
            A.tab("ponto");
            A.rowMenu("19c");
          },
          "menu-dia": () => {
            A.tab("ponto");
            A.dayMenu("19");
          },
          resumo: () => {
            A.tab("ponto");
            A.go("resumo-do-dia", { rday: "17" });
          },
          batida: () => {
            A.tab("ponto");
            A.detail("17a");
          },
          corrigir: () => {
            A.tab("ponto");
            A.openEdit("19c");
          },
          incluir: () => {
            A.tab("ponto");
            A.openInsert("19");
          },
          abono: () => {
            A.tab("ponto");
            A.openAbono("19");
          },
          solicitacoes: () => {
            A.tab("ponto");
            A.openReqs();
          },
          nova: () => {
            A.tab("ponto");
            A.openChooser();
          },
          atestados: () => {
            A.tab("inicio");
            A.go("atestados");
          },
          "enviar-atestado": () => {
            A.tab("inicio");
            A.go("atestados");
            A.newAt();
          },
          "atestado-erro": () => {
            A.tab("inicio");
            A.go("atestados");
            A.newAt();
            A.atSubmit();
          },
          "atestado-anexos": () => {
            A.tab("inicio");
            A.go("atestados");
            A.editAt("a3");
          },
          "atestado-enviado": () => {
            S.atLast = { per: "03/11", dias: 1, n: 2 };
            S.atWasEdit = false;
            A.rep("atestado-enviado");
            S.hist = ["inicio", "atestados"];
          },
          atestado: () => {
            A.tab("inicio");
            A.go("atestados");
            A.openAt("a1");
          },
          "atestado-recusado": () => {
            A.tab("inicio");
            A.go("atestados");
            A.openAt("a2");
          },
          ferias: () => {
            A.tab("inicio");
            A.go("ferias");
          },
          "solicitar-ferias": () => {
            A.tab("inicio");
            A.go("ferias");
            A.newFer();
          },
          "ferias-erro": () => {
            A.tab("inicio");
            A.go("ferias");
            A.newFer(30);
            A.ferSubmit();
          },
          "ferias-enviada": () => {
            S.ferLast = { ini: "04/01/2027", fim: "13/01/2027", dias: 10 };
            A.rep("ferias-enviada");
            S.hist = ["inicio", "ferias"];
          },
          "ferias-detalhe": () => {
            A.tab("inicio");
            A.go("ferias");
            A.openFer("f1");
          },
          "ferias-recusada": () => {
            A.tab("inicio");
            A.go("ferias");
            A.openFer("fr");
          },
          perfil: () => A.tab("perfil"),
        };
        const IDX = [
          ["Acesso", [["entrar", "Entrar"]]],
          [
            "Início",
            [
              ["inicio", "Início"],
              ["notificacoes", "Notificações"],
              ["menu", "Menu lateral"],
              ["registrar", "Registrar ponto"],
              ["comprovante", "Comprovante"],
            ],
          ],
          [
            "Ponto",
            [
              ["ponto", "Batidas"],
              ["filtros", "Filtros"],
              ["menu-batida", "Menu da batida"],
              ["menu-dia", "Menu do dia"],
              ["resumo", "Resumo do dia"],
              ["batida", "Detalhes da batida"],
              ["corrigir", "Corrigir batida"],
              ["incluir", "Incluir batida"],
              ["abono", "Solicitar abono"],
              ["solicitacoes", "Minhas solicitações"],
              ["nova", "Nova solicitação"],
            ],
          ],
          [
            "Atestados médicos",
            [
              ["atestados", "Lista"],
              ["enviar-atestado", "Enviar"],
              ["atestado-anexos", "Vários anexos"],
              ["atestado-erro", "Envio sem anexo"],
              ["atestado-enviado", "Enviado"],
              ["atestado", "Aprovado"],
              ["atestado-recusado", "Recusado"],
            ],
          ],
          [
            "Férias",
            [
              ["ferias", "Visão geral"],
              ["solicitar-ferias", "Solicitar"],
              ["ferias-erro", "Acima do saldo"],
              ["ferias-enviada", "Solicitada"],
              ["ferias-detalhe", "Aprovadas"],
              ["ferias-recusada", "Recusadas"],
            ],
          ],
          ["Conta", [["perfil", "Perfil"]]],
        ];
        $("#idx").innerHTML = IDX.map(
          (g) =>
            '<div class="grp"><h2>' +
            g[0] +
            "</h2><div>" +
            g[1]
              .map(
                (x) =>
                  '<button class="jb" type="button" data-k="' +
                  x[0] +
                  '">' +
                  x[1] +
                  "</button>"
              )
              .join("") +
            "</div></div>"
        ).join("");
        $("#idx").addEventListener("click", (e) => {
          const b = e.target.closest("[data-k]");
          if (b) A.jump(b.dataset.k);
        });
        $("#wm").innerHTML = logo(30) + "<span>Single</span>";
        $("#reset")?.addEventListener("click", () => {
          S = init();
          lastScr = null;
          setHash();
          render();
        });
        function curKey() {
          if (S.comp) return "comprovante";
          if (S.drawer) return "menu";
          const sh = {
            ponto: "registrar",
            filtros: "filtros",
            dia_menu: "menu-dia",
            abono: "abono",
            reqs: "solicitacoes",
            nova: "nova",
          };
          if (S.sheet === "edit")
            return S.ed && S.ed.row ? "corrigir" : "incluir";
          if (sh[S.sheet]) return sh[S.sheet];
          if (S.menu && S.scr === "ponto") return "menu-batida";
          const m = {
            "resumo-do-dia": "resumo",
            atestado: curAt().s === "rec" ? "atestado-recusado" : "atestado",
            "ferias-detalhe":
              curFer().s === "rec" ? "ferias-recusada" : "ferias-detalhe",
            "enviar-atestado":
              S.at && S.at.err && !S.at.files.length
                ? "atestado-erro"
                : S.at && S.at.edit
                ? "atestado-anexos"
                : "enviar-atestado",
            "solicitar-ferias":
              S.fer && S.fer.err ? "ferias-erro" : "solicitar-ferias",
          };
          return m[S.scr] || S.scr;
        }
        function syncIdx() {
          const k = curKey();
          document.querySelectorAll(".jb").forEach((b) => {
            const on = b.dataset.k === k;
            b.classList.toggle("on", on);
            if (on) b.setAttribute("aria-current", "true");
            else b.removeAttribute("aria-current");
          });
        }

        window.addEventListener("hashchange", () => {
          const h = location.hash.slice(1);
          if (SCR[h] && h !== S.scr) {
            if (h === "enviar-atestado" && !S.at)
              S.at = {
                ini: "19/11/2026",
                fim: "19/11/2026",
                multi: false,
                obs: "",
                files: [],
                err: "",
                edit: null,
              };
            if (h === "solicitar-ferias" && !S.fer)
              S.fer = {
                ini: "04/01/2027",
                dias: 10,
                vender: false,
                adiant: false,
                err: "",
              };
            S.scr = h;
            S.comp = null;
            clean();
            render();
          }
        });
        setInterval(() => {
          if (running() && !S.comp) {
            S.sec++;
            const a = $("#tmhm"),
              b = $("#tms");
            if (a) {
              a.textContent = hm(S.sec);
              b.textContent = pad(S.sec % 60);
            }
          }
        }, 1000);
        {
          const h = location.hash.slice(1);
          if (SCR[h]) {
            S.scr = h;
            if (h === "enviar-atestado")
              S.at = {
                ini: "19/11/2026",
                fim: "19/11/2026",
                multi: false,
                obs: "",
                files: [],
                err: "",
                edit: null,
              };
            if (h === "solicitar-ferias")
              S.fer = {
                ini: "04/01/2027",
                dias: 10,
                vender: false,
                adiant: false,
                err: "",
              };
          }
        }
        render();
      }
    </script>
  </body>
</html>
